name: release

on:
  workflow_call:
    inputs:
      main-build:
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    concurrency:
      group: release-${{ inputs.main-build && 'main-build' || github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.main-build && format('main-{0}', github.sha) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.mod
      - name: build all targets
        run: |
          mkdir -p dist
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}
            out=fornax-$os-$arch
            [ "$os" = windows ] && out=$out.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG}" -o "dist/$out" . || exit 1
          done
          cd dist && sha256sum -- * > sha256sums.txt
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_BUILD: ${{ inputs.main-build }}
        run: |
          if [ "$MAIN_BUILD" != true ]; then
            gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TAG" --generate-notes
            exit 0
          fi
          # GITHUB_TOKEN cannot tag a commit whose workflows differ from main:
          # https://docs.github.com/rest/releases/releases#create-a-release
          workflow_tree() {
            gh api "repos/$GITHUB_REPOSITORY/git/trees/$1?recursive=1" \
              --jq '.tree[] | select(.path == ".github/workflows") | .sha'
          }
          built_workflows=$(workflow_tree "$GITHUB_SHA")
          current_workflows=$(workflow_tree main)
          if [ "$built_workflows" != "$current_workflows" ]; then
            echo "A newer workflow is on main; leaving publication to that run."
            exit 0
          fi
          if gh release view main-build >/dev/null 2>&1; then
            published=$(gh release download main-build -p version.txt -O -)
            comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/${published#main-}...$GITHUB_SHA" --jq .status)
            if [ "$comparison" != ahead ] && [ "$comparison" != identical ]; then
              echo "Keeping $published; this run does not advance the published main build."
              exit 0
            fi
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease \
              --title "$RELEASE_TAG" --notes "Built from main commit $GITHUB_SHA after CI passed."
          fi
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          fi
          printf '%s\n' "$RELEASE_TAG" > version.txt
          if ! gh release view main-build >/dev/null 2>&1; then
            gh release create main-build version.txt --target main --prerelease --latest=false \
              --title 'Latest main build' --notes 'The installer follows version.txt to the latest successful main build.'
          else
            gh release upload main-build version.txt --clobber
          fi
          printf 'Latest successful main build: [%s](https://github.com/%s/releases/tag/%s).\n' \
            "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RELEASE_TAG" > main-notes.md
          gh release edit main-build --target main --notes-file main-notes.md
