<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fornax studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff7a3d'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23121110'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/chat.css">
<link rel="stylesheet" href="/assets/video.css">
<link rel="stylesheet" href="/assets/voice.css">
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-dice" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 10l6 6 6-6M5 20h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></symbol>
  <symbol id="i-voice" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-paperclip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11l-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v8"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-updown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6M5 20h14"/></symbol>
</svg>

<div class="offline-banner" role="status">Studio stopped. Run <span class="mono">fornax studio</span> again and this page reconnects.</div>

<div class="shell">
  <nav class="rail" aria-label="Modes">
    <span class="brand-mark" title="fornax studio"></span>
    <a href="#chat" data-mode="chat"><svg><use href="#i-chat"/></svg>Chat</a>
    <a href="#image" data-mode="image"><svg><use href="#i-image"/></svg>Image</a>
    <a href="#video" data-mode="video"><svg><use href="#i-video"/></svg>Video</a>
    <a href="#voice" data-mode="voice"><svg><use href="#i-voice"/></svg>Voice</a>
    <span class="rail-host" id="rail-host" hidden></span>
  </nav>

  <section class="mode" id="mode-chat" hidden></section>

  <section class="mode" id="mode-image" hidden>
  <div class="app" data-kind="image">
  <aside class="composer" id="composer">
    <div class="composer-scroll">
      <div class="field">
        <label class="label" for="model">Model</label>
        <select id="model"></select>
      </div>

      <div class="field">
        <label class="label" for="prompt">Prompt</label>
        <textarea id="prompt" placeholder="A lighthouse at dusk, loose watercolor, warm light in the window"></textarea>
      </div>

      <div class="field">
        <div class="label"><span>Shape</span><output id="size-out"></output></div>
        <div class="segmented" id="ratios" role="group" aria-label="Aspect ratio"></div>
      </div>

      <div class="field">
        <div class="label"><span>Detail</span><span class="hint" id="tier-hint"></span></div>
        <div class="segmented" id="tiers" role="group" aria-label="Resolution"></div>
      </div>

      <div class="field">
        <div class="label"><span>Reference images</span><span class="hint">for edit models</span></div>
        <div class="refs" id="refs"></div>
        <input type="file" id="ref-file" accept="image/png,image/jpeg,image/webp" multiple hidden>
      </div>

      <details id="advanced">
        <summary><svg><use href="#i-chev"/></svg>More options</summary>
        <div class="advanced">
          <div class="field">
            <div class="label"><label for="steps">Steps</label><output id="steps-out"></output></div>
            <input type="range" id="steps" min="4" max="50" step="1">
          </div>
          <div class="field">
            <div class="label"><label for="seed">Seed</label><span class="hint" id="seed-hint">random each run</span></div>
            <div class="seed-row">
              <input class="input" id="seed" inputmode="numeric" placeholder="Random">
              <button class="icon-btn" id="seed-lock" type="button" aria-pressed="false" title="Keep this seed"><svg><use href="#i-lock"/></svg></button>
              <button class="icon-btn" id="seed-roll" type="button" title="New seed"><svg><use href="#i-dice"/></svg></button>
            </div>
          </div>
          <div class="field">
            <label class="label" for="negative">Negative prompt</label>
            <textarea id="negative" class="small" placeholder="What to keep out"></textarea>
          </div>
        </div>
      </details>
    </div>
    <div class="composer-foot">
      <button class="generate" id="generate" type="button"><span>Generate</span><kbd id="kbd">⌘ ↵</kbd></button>
      <div class="foot-note"><span id="estimate"></span><span id="queue-note"></span></div>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="main-inner">
      <div class="grid" id="grid"></div>
      <div id="empty"></div>
    </div>
  </main>
</div>
  </section>

  <section class="mode" id="mode-video" hidden></section>

  <section class="mode" id="mode-voice" hidden></section>
</div>

<dialog id="viewer">
  <div class="viewer">
    <div class="stage" id="stage">
      <img id="viewer-img" alt="">
      <button class="icon-btn nav prev" id="prev" type="button" title="Previous (←)"><svg><use href="#i-left"/></svg></button>
      <button class="icon-btn nav next" id="next" type="button" title="Next (→)"><svg><use href="#i-chev"/></svg></button>
    </div>
    <aside class="details">
      <div class="details-head"><span id="viewer-when"></span><button class="icon-btn small-icon" id="close" type="button" title="Close (Esc)"><svg><use href="#i-x"/></svg></button></div>
      <div class="field">
        <div class="label"><span>Prompt</span><button class="text-btn" id="copy-prompt" type="button">Copy</button></div>
        <p class="prompt-text" id="viewer-prompt"></p>
      </div>
      <div class="field" id="viewer-neg-wrap">
        <div class="label">Negative</div>
        <p class="prompt-text" id="viewer-neg"></p>
      </div>
      <div class="field" id="viewer-refs-wrap">
        <div class="label">References</div>
        <div class="ref-strip" id="viewer-refs"></div>
      </div>
      <dl class="facts" id="viewer-facts"></dl>
      <div class="actions">
        <button class="action primary" id="act-vary" type="button"><svg><use href="#i-redo"/></svg>Vary</button>
        <button class="action" id="act-reuse" type="button"><svg><use href="#i-edit"/></svg>Reuse</button>
        <button class="action" id="act-ref" type="button"><svg><use href="#i-image"/></svg>As reference</button>
        <a class="action" id="act-download" download><svg><use href="#i-down"/></svg>Download</a>
        <button class="action danger" id="act-delete" type="button"><svg><use href="#i-trash"/></svg>Delete</button>
      </div>
    </aside>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/assets/core.js"></script>
<script src="/assets/image.js"></script>
<script src="/assets/chat.js"></script>
<script src="/assets/video.js"></script>
<script src="/assets/voice.js"></script>
</body>
</html>
